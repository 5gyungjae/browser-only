<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로또번호추천</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-orb bg-orb-left"></div>
    <div class="bg-orb bg-orb-right"></div>

    <main class="page">
      <section class="hero">
        <div class="hero-copy">
          <h1>로또번호추천</h1>
          <p class="intro">
            가장 많이 나온 숫자 조합 후 랜덤으로 5개 보여줍니다.
          </p>
        </div>

        <div class="hero-side">
          <div class="link-grid">
            <a class="button-link" href="https://www.dhlottery.co.kr/gameResult.do?method=buyLotto" target="_blank" rel="noreferrer">
              로또 사러가기
            </a>
            <a class="button-link" href="https://www.dhlottery.co.kr/lt645/result" target="_blank" rel="noreferrer">
              추첨결과 보러가기
            </a>
          </div>
          <div class="button-group">
            <button id="refreshButton" type="button">번호 다시 만들기</button>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <p class="section-kicker">Random 5 Picks</p>
            <h2>추천 번호</h2>
          </div>
          <div class="panel-actions">
            <button id="copyAllButton" type="button" class="button-secondary icon-button">
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <path d="M9 9h10v11H9z"></path>
                  <path d="M5 5h10v2H7v8H5z"></path>
                </svg>
              </span>
              <span>전체 복사</span>
            </button>
            <button id="shareAllButton" type="button" class="button-secondary icon-button">
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <path d="M14 3l6 6-1.4 1.4-3.6-3.6V15h-2V6.8l-3.6 3.6L8 9z"></path>
                  <path d="M5 11h2v8h10v-8h2v10H5z"></path>
                </svg>
              </span>
              <span>전체 공유</span>
            </button>
          </div>
        </div>
        <div id="cards" class="cards"></div>
      </section>
    </main>

    <div class="toast" id="toast" aria-live="polite"></div>

    <template id="cardTemplate">
      <article class="card">
        <div class="card-head">
          <span class="rank"></span>
        </div>
        <div class="balls"></div>
        <div class="card-actions">
          <button type="button" class="button-secondary card-copy icon-button">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M9 9h10v11H9z"></path>
                <path d="M5 5h10v2H7v8H5z"></path>
              </svg>
            </span>
            <span>번호 복사</span>
          </button>
          <button type="button" class="button-secondary card-share icon-button">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M14 3l6 6-1.4 1.4-3.6-3.6V15h-2V6.8l-3.6 3.6L8 9z"></path>
                <path d="M5 11h2v8h10v-8h2v10H5z"></path>
              </svg>
            </span>
            <span>번호 공유</span>
          </button>
        </div>
      </article>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
